<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard financeiro · VetCare</title>
  <link rel="icon" href="/assets/simbolo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Módulo Administração · Tela: Dashboard financeiro (REQ 15) — dados da API /financeiro/dashboard -->
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="conteudo">
      <header class="topo">
        <div>
          <h1>Dashboard financeiro</h1>
          <p class="sub" id="periodo"></p>
        </div>
        <div class="segmentado" role="group" aria-label="Período">
          <button data-p="dia">Dia</button><button data-p="semana">Semana</button><button data-p="mes" class="ativo" aria-pressed="true">Mês</button>
        </div>
      </header>
      <div class="kpis" id="kpis"></div>

      <div class="grid-2" style="grid-template-columns:1.5fr 1fr">
        <section class="card">
          <h2>Recebimentos por semana</h2>
          <div class="legenda"><span><i style="background:var(--primary-default)"></i>Recebido (últimas 6 semanas)</span></div>
          <div class="grafico-barras" id="fluxo" role="img"></div>
          <div class="eixo-x" id="fluxoEixo"></div>
        </section>
        <section class="card">
          <h2>Atendimentos realizados por semana</h2>
          <div class="grafico-barras" id="atend" role="img" style="margin-top:46px"></div>
          <div class="eixo-x" id="atendEixo"></div>
        </section>
      </div>

      <div class="grid-2-igual" style="margin-top:24px">
        <section class="card">
          <h2>Recebimentos por forma de pagamento</h2>
          <div id="formas"></div>
        </section>
        <section class="card">
          <h2>Recebimentos recentes</h2>
          <table class="tabela">
            <thead><tr><th>Animal</th><th>Valor</th><th>Forma</th><th>Quando</th></tr></thead>
            <tbody id="recentes"></tbody>
          </table>
        </section>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const usuario = exigirLogin("relatorios");
    montarLayout(usuario, "financeiro");
    const $ = (id) => document.getElementById(id);

    function renderKpis(d) {
      $("periodo").textContent = d.periodo_rotulo;
      const kpis = [
        ["Recebido", moeda(d.recebido)], ["A receber", moeda(d.a_receber)],
        ["Ticket médio", moeda(d.ticket_medio)], ["Atendimentos", d.atendimentos],
      ];
      $("kpis").innerHTML = kpis.map(([t, v]) => `<div class="kpi"><span>${t}</span><strong>${String(v).replace(",00", "")}</strong></div>`).join("");
    }

    function renderGraficos(d) {
      const maxE = Math.max(1, ...d.series.map((s) => s.entradas));
      $("fluxo").innerHTML = d.series.map((s) => `
        <div class="grupo-barras">
          <div class="barra" style="height:${(s.entradas / maxE) * 100}%;background:var(--primary-default)" title="${s.rotulo}: ${moeda(s.entradas)}"></div>
        </div>`).join("");
      $("fluxo").setAttribute("aria-label", d.series.map((s) => `${s.rotulo}: ${moeda(s.entradas)}`).join("; "));
      $("fluxoEixo").innerHTML = d.series.map((s) => `<span>${escapar(s.rotulo)}</span>`).join("");

      const maxA = Math.max(1, ...d.series.map((s) => s.atendimentos));
      $("atend").innerHTML = d.series.map((s) => `<div class="barra" style="height:${(s.atendimentos / maxA) * 88}%;background:var(--primary-default)"><span class="valor">${s.atendimentos}</span></div>`).join("");
      $("atend").setAttribute("aria-label", d.series.map((s) => `${s.rotulo}: ${s.atendimentos} atendimentos`).join("; "));
      $("atendEixo").innerHTML = d.series.map((s) => `<span>${escapar(s.rotulo)}</span>`).join("");
    }

    function renderFormas(d) {
      $("formas").innerHTML = d.formas.map((f) => `
        <div class="linha-progresso"><span>${f.forma}</span><span>${f.percentual}% · ${moeda(f.valor)}</span></div>
        <div class="progresso" role="progressbar" aria-label="${f.forma}" aria-valuenow="${f.percentual}" aria-valuemin="0" aria-valuemax="100"><div style="width:${f.percentual}%"></div></div>`).join("");
    }

    function renderRecentes(d) {
      $("recentes").innerHTML = d.recentes.length
        ? d.recentes.map((r) => `<tr><td>${escapar(r.animal_nome || "—")}</td><td>${moeda(r.valor)}</td><td>${escapar(r.forma)}</td><td>${quando(r.criado_em)}</td></tr>`).join("")
        : `<tr><td colspan="4" class="vazio">Nenhum recebimento ainda.</td></tr>`;
    }

    async function carregar(periodo) {
      try {
        const d = await api("/financeiro/dashboard", { query: { periodo } });
        renderKpis(d); renderGraficos(d); renderFormas(d); renderRecentes(d);
      } catch (e) { toast(e.message, "erro"); }
    }

    document.querySelectorAll(".segmentado button").forEach((b) => (b.onclick = () => {
      document.querySelectorAll(".segmentado button").forEach((x) => { x.classList.remove("ativo"); x.removeAttribute("aria-pressed"); });
      b.classList.add("ativo"); b.setAttribute("aria-pressed", "true");
      carregar(b.dataset.p);
    }));
    carregar("mes");
  </script>
</body>
</html>
