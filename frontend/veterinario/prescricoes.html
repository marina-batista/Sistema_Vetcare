<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prescrições · VetCare</title>
  <link rel="icon" href="/assets/simbolo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Módulo Veterinário · Tela: Prescrições + popup "Emitir prescrição" (js/prescricao.js)
       Fora da Sprint 1: prescrições ficam no navegador (localStorage) + exemplos de mock.js. -->
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="conteudo">
      <header class="topo">
        <div>
          <h1>Prescrições</h1>
          <p class="sub" id="sub"></p>
        </div>
        <button class="btn btn-primario" id="btnNova">Nova prescrição</button>
      </header>

      <section class="card">
        <div class="filtros">
          <input class="busca" id="busca" type="search" placeholder="Buscar por animal, tutor ou medicamento" aria-label="Buscar por animal, tutor ou medicamento">
          <select id="periodo" aria-label="Período">
            <option value="">Todos os períodos</option><option value="30">Últimos 30 dias</option><option value="90">Últimos 90 dias</option>
          </select>
        </div>
        <div class="tabela-wrap">
          <table class="tabela">
            <thead><tr><th>Data</th><th>Animal</th><th>Tutor</th><th>Medicamentos</th><th>Ações</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="rodape-tabela" id="rodape"></div>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/mock.js"></script>
  <script src="/js/prescricao.js"></script>
  <script>
    const usuario = exigirLogin("prontuario");
    montarLayout(usuario, "prescricoes");
    const $ = (id) => document.getElementById(id);
    $("sub").textContent = `Prescrições emitidas por ${usuario.nome}`;
    let pagina = 1, filtradas = [], animais = null;

    const resumoMed = (m) => m[0].nome + (m.length > 1 ? ` +${m.length - 1}` : "");

    function render() {
      const q = $("busca").value.trim().toLowerCase();
      const dias = Number($("periodo").value);
      const limite = dias ? isoData(somarDias(new Date(), -dias)) : "";
      filtradas = todasPrescricoes().filter((p) => (!limite || p.data >= limite) &&
        (!q || [p.animal, p.tutor, ...p.medicamentos.map((m) => m.nome)].some((t) => t.toLowerCase().includes(q))));
      const visiveis = filtradas.slice((pagina - 1) * 7, pagina * 7);
      $("tbody").innerHTML = visiveis.length ? visiveis.map((p) => `
        <tr>
          <td>${dataBR(p.data)}</td><td class="destaque">${escapar(p.animal)}</td><td>${escapar(p.tutor)}</td>
          <td>${escapar(resumoMed(p.medicamentos))}</td>
          <td><div class="acoes"><button class="link-acao" data-ver="${p.id}">Ver</button><button class="link-acao" data-pdf="${p.id}">Baixar PDF</button></div></td>
        </tr>`).join("") : `<tr><td colspan="5" class="vazio">Nenhuma prescrição encontrada.</td></tr>`;
      renderPaginacao($("rodape"), { pagina, tamanho: 7, total: filtradas.length }, (p) => { pagina = p; render(); });
    }

    $("tbody").onclick = (e) => {
      const b = e.target.closest("button"); if (!b) return;
      const p = todasPrescricoes().find((x) => x.id === (b.dataset.ver || b.dataset.pdf));
      if (b.dataset.ver) abrirDialogo("Prescrição", htmlPrescricao(p)); else imprimirPrescricao(p);
    };

    async function novaPrescricao(animalId) {
      try { if (!animais) ({ itens: animais } = await api("/animais", { query: { tamanho: 500 } })); }
      catch (e) { return toast(e.message, "erro"); }
      const animal = animais.find((a) => a.id === Number(animalId)) || null;
      abrirPrescricao({ animal, animais, usuario, aoEmitir: () => { pagina = 1; render(); } });
    }

    $("btnNova").onclick = () => novaPrescricao(null);
    $("btnNova").hidden = !pode("prontuario", "editar");
    $("busca").oninput = debounce(() => { pagina = 1; render(); }, 150);
    $("periodo").onchange = () => { pagina = 1; render(); };
    render();
    if (parametro("nova")) novaPrescricao(parametro("animal_id"));
  </script>
</body>
</html>
